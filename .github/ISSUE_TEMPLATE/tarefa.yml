# gerado pelo agilekit — edite em DEVassos/agilekit (repo/.github/ISSUE_TEMPLATE/tarefa.yml)
name: "Tarefa técnica"
description: "Fatia de trabalho de uma história (ou enabler: infra, estrutura, docs base)."
title: "[tarefa] "
labels: ["tipo:tarefa"]
body:
  - type: input
    id: pai
    attributes:
      label: "História pai"
      description: "Número da história (#n). Para enablers sem história, escreva 'enabler'."
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: oque
    attributes:
      label: "O que fazer"
      description: "Resultado concreto e verificável (arquivo, endpoint, tela, tabela)."
    validations:
      required: true
  - type: dropdown
    id: requisito
    attributes:
      label: "Requisito relacionado"
      multiple: true
      options: ["RF01", "RF02", "RF03", "RF04", "RF05", "RF06", "RF07", "RF08", "RF09", "RF10", "RF11", "RF12", "RF13", "RF14", "RF15", "RNF01", "RNF02", "RNF03", "RNF04", "RNF05"]
  - type: dropdown
    id: area
    attributes:
      label: "Área"
      options: ["backend", "frontend", "db", "infra", "docs"]
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: "DoD relevante"
      description: "Quais itens da DoD-PR pesam aqui (ex.: api.md, schema + database/README, sem any)."
  - type: dropdown
    id: estimativa
    attributes:
      label: "Estimativa (pontos)"
      options: ["1", "2", "3", "5"]
