      required: true
  - type: textarea
    id: resultado
    attributes:
      label: "Resultado esperado / como saber que deu certo"
    validations:
      required: true
  - type: input
    id: prazo
    attributes:
      label: "Prazo"
      placeholder: "AAAA-MM-DD"
