# gerado pelo agilekit — edite em DEVassos/agilekit (repo/.github/dependabot.yml)
# Sem PRs automáticos (#181): PRs do bot nascem sem issue, contra main, e não passam nos checks do time.
# GitHub Actions: version updates desligadas por open-pull-requests-limit: 0 (a configuração fica registrada).
# Dependências npm: só alertas de segurança (Dependabot alerts); as atualizações entram por issue e PR para develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
    labels: ["tipo:processo", "area:infra"]
    commit-message:
      prefix: "ci(infra)"
