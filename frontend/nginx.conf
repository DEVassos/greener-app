# Servidor do frontend do GreenER (imagem nginx-unprivileged: roda sem root, na porta 8080).
# Serve o build do Vite (dist/) e devolve o index.html nas rotas do react-router (/configuracao…).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # JS e CSS com hash no nome, gerados pelo Vite: podem ficar em cache por um ano
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Qualquer outra rota é da SPA: entrega o index.html sem cache, para um deploy novo aparecer na hora
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
